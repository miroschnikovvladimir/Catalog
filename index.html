<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <title>Каталог историй</title>
    <script src="https://telegram.org/js/telegram-web-app.js?63"></script>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main class="app-shell">
      <header class="app-header">
        <p class="eyebrow">Сорассказчик</p>
        <h1>Каталог историй</h1>
        <p class="subtitle">Выбери мир, в который хочется погрузиться.</p>
      </header>

      <section id="catalog-view" aria-label="Каталог">
        <label class="search" for="search-input">
          <span aria-hidden="true">⌕</span>
          <input id="search-input" type="search" placeholder="Поиск историй" autocomplete="off">
        </label>
        <section class="filters" aria-label="Категории">
          <h2>Категории</h2>
          <div id="category-filters" class="filter-list"></div>
        </section>
        <section class="filters" aria-label="Теги">
          <h2>Теги</h2>
          <div id="tag-filters" class="filter-list"></div>
        </section>
        <p id="catalog-status" class="status" role="status">Загружаю каталог…</p>
        <section id="cards" class="cards" aria-live="polite"></section>
      </section>

      <section id="detail-view" class="detail" hidden aria-live="polite"></section>
    </main>
    <script src="./app.js"></script>
  </body>
</html>
